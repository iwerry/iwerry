<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title description">
<title id="title">Daniel Rodrigues | UX/UI Designer and Front-End Developer</title>
<desc id="description">DesignerX motion identity: navy editorial banner with bold lavender headline, animated perspective grid, luminous network, restrained moving light, and professional signature.</desc>
<defs>
 <linearGradient id="base" x2="1" y2="1"><stop stop-color="#07082b"/><stop offset=".65" stop-color="#111343"/><stop offset="1" stop-color="#07082b"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#6f74ff" stop-opacity=".33"/><stop offset="1" stop-color="#6f74ff" stop-opacity="0"/></radialGradient>
 <linearGradient id="headline" x2="1"><stop stop-color="#6f74ff"/><stop offset=".58" stop-color="#9399ff"/><stop offset="1" stop-color="#6f74ff"/></linearGradient>
 <linearGradient id="beam" x2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".49" stop-color="#e6e7ff" stop-opacity="0"/><stop offset=".5" stop-color="#e6e7ff" stop-opacity=".7"/><stop offset=".51" stop-color="#e6e7ff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#6877d9" stroke-opacity=".18" stroke-width="1"/></pattern>
 <clipPath id="word"><rect x="45" y="86" width="1095" height="145" rx="3"/></clipPath>
 <style>
 .display{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;font-stretch:condensed;font-weight:900}
 .editorial{font-family:Newsreader,Georgia,serif}
 .network circle{animation:pulse 3.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
 .network circle:nth-child(2n){animation-delay:-1.8s}
 .network circle:nth-child(3n){animation-delay:-.9s}
 .mesh{animation:drift 24s linear infinite}
 .light{animation:traverse 9s ease-in-out infinite}
 .halo{animation:float 9s ease-in-out infinite}
 .signal{stroke-dasharray:7 70;animation:signal 6s linear infinite}
 @keyframes drift{to{transform:translate(36px,36px)}}
 @keyframes traverse{0%,14%{transform:translateX(-950px)}65%,100%{transform:translateX(1450px)}}
 @keyframes float{50%{transform:translate(-26px,12px)}}
 @keyframes pulse{from{opacity:.24;transform:scale(.68)}to{opacity:.95;transform:scale(1.18)}}
 @keyframes signal{to{stroke-dashoffset:-77}}
 @media(prefers-reduced-motion:reduce){.mesh,.light,.halo,.signal,.network circle{animation:none}}
 </style>
</defs>
<rect width="1200" height="400" fill="url(#base)"/>
<rect width="1200" height="400" fill="url(#grid)" class="mesh"/>
<g class="halo"><ellipse cx="1020" cy="175" rx="270" ry="195" fill="url(#glow)"/></g>
<g class="network" fill="#949dff">
 <path d="M870 64L960 106L1088 69L1148 150L1067 212L950 195L878 274L1103 310L1167 260M960 106L950 195L1067 212L1088 69M878 274L950 195L1103 310L1067 212" fill="none" stroke="#7783eb" stroke-opacity=".32" stroke-width="1.4"/>
 <path class="signal" d="M870 64L960 106L1088 69L1148 150L1067 212L950 195L878 274" fill="none" stroke="#c6caff" stroke-width="2"/>
 <circle cx="870" cy="64" r="3"/><circle cx="960" cy="106" r="4"/><circle cx="1088" cy="69" r="3"/><circle cx="1148" cy="150" r="4"/><circle cx="1067" cy="212" r="4"/><circle cx="950" cy="195" r="3"/><circle cx="878" cy="274" r="4"/><circle cx="1103" cy="310" r="3"/><circle cx="1167" cy="260" r="4"/>
</g>
<rect x="46" y="41" width="5" height="16" rx="1" fill="#9098ff"/>
<text x="65" y="54" fill="#bac0f4" font-size="16" letter-spacing="4" class="display">DESIGN / CODE / MOTION / AI</text>
<g clip-path="url(#word)">
 <text x="46" y="202" font-size="126" letter-spacing="-1.5" textLength="1035" lengthAdjust="spacingAndGlyphs" fill="url(#headline)" class="display">UX/UI DESIGNER</text>
 <rect x="-950" y="96" width="950" height="116" fill="url(#beam)" class="light" opacity=".52"/>
</g>
<rect x="48" y="229" width="620" height="3" rx="1.5" fill="#727cff"/>
<text x="48" y="278" font-size="44" letter-spacing="1.1" fill="#f2f2ff" class="display">DANIEL RODRIGUES</text>
<text x="48" y="312" font-size="22" fill="#c6cbf3" class="editorial">Front-End Developer · Creative Technologist</text>
<text x="48" y="345" font-size="19" font-style="italic" fill="#aab2e7" class="editorial">Interfaces and creative systems with purpose.</text>
<path d="M0 387H1200" stroke="#686af4" stroke-opacity=".55"/><rect y="394" width="1200" height="6" fill="#1d21ff"/>
</svg>